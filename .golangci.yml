# Golangci-lint configuration for MicroFlash ISP Platform (Go)
# Docs: https://golangci-lint.run/usage/configuration/
#
# Enables gosec for security linting alongside other linters.

run:
  timeout: 5m
  skip-dirs:
    - vendor
    - node_modules
    - .git

linters:
  enable:
    - gosec  # Security linter (Golang security checker)
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - exportloopref
    - forbidigo
    - goconst
    - gocritic
    - gofmt
    - goimports
    - gosec
    - misspell
    - nilerr
    - prealloc
    - predeclared
    - revive
    - unconvert
    - unparam
    - wastedassign

linters-settings:
  gosec:
    # Which rules to enable (see https://securego.io/rules.html)
    # All rules enabled by default
    excludes:
      - G104  # Unhandled errors (too noisy for initial adoption)
      - G304  # File path provided as taint input (intentional in some cases)
    severity: medium
    confidence: medium

  errcheck:
    check-type-assertions: true
    check-blank: false

  govet:
    enable-all: true
    disable:
      - fieldalignment  # Too noisy

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: range
      - name: receiver-naming
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code
      - name: redefines-builtin-id

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - revive
  max-issues-per-linter: 50
  max-same-issues: 5
